services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: cheapmtg-postgres
    restart: always
    environment:
      POSTGRES_DB: cheapmtg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cheapmtg"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
